name: Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  security:
    name: Supply chain
    uses: sebastienrousseau/config/.github/workflows/reusable-security.yml@e0c2690897e452aeab6febba46bfadc417370fe8 # main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      node-version: '20'
